<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>열돌이 키우기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 위에 HUD, 왼쪽은 열돌이의 방(캐릭터), 오른쪽은 문제 카드. 좁은 화면에선 위아래로 쌓임.
   게임 화면 하나의 밝은 색감으로 고정한 디자인(라이트/다크 공통). */
:root{
  color-scheme: light;
  --bg:#9FE6D6; --dot:#88D8C5; --ink:#24163F; --card:#FFFDF4; --soft:#FFF1CF; --floor:#FFD59A;
  --cd:#FF6A3D; --cv:#2F9BFF; --rd:#FFB800; --pink:#FF5FA2; --good:#22B861; --bad:#FF4D5E; --muted:#5E5378;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--dot) 2.5px,transparent 3px);background-size:26px 26px;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
.screen{min-height:100%;box-sizing:border-box;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.box{background:var(--card);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink)}
.btn{font-family:var(--display);font-size:21px;line-height:1.2;border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);background:var(--card);color:var(--ink);padding:10px 20px;cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s;touch-action:manipulation}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn:focus-visible,input:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
.btn.go{background:var(--pink);color:#fff;text-shadow:0 2px 0 rgba(36,22,63,.35)}
.btn.small{font-size:16px;padding:6px 12px;border-width:3px;box-shadow:0 4px 0 var(--ink);border-radius:14px}
.btn.small:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* ---------- 시작 화면 ---------- */
.logo{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px}
.logo .kick{font-family:var(--display);font-size:18px;background:var(--ink);color:var(--rd);padding:4px 14px;border-radius:999px;letter-spacing:.06em}
.logo h1{font-size:clamp(46px,9vw,84px);line-height:1.05;color:var(--card);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink)}
.logo h1 em{font-style:normal;color:var(--cd)}
.startgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.startchar{background:linear-gradient(var(--soft) 72%,var(--floor) 72%);padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;overflow:hidden}
.startchar .heroBox{max-width:300px}
.startform{padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.startform label{font-family:var(--display);font-size:22px}
#nameInput{font-family:var(--display);font-size:26px;border:4px solid var(--ink);border-radius:16px;padding:10px 14px;background:#fff;color:var(--ink);min-width:0}
.startform .go{font-size:28px;padding:14px}
.plist{display:flex;flex-wrap:wrap;gap:10px}
.plist:empty{display:none}
.ptitle{font-family:var(--display);font-size:18px;color:var(--muted)}
.pchip{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;font-size:18px}
.pchip svg{width:44px;height:44px}
.pchip small{font-family:var(--body);font-size:14px;color:var(--muted)}
.rules{margin:0;padding:12px 14px 12px 34px;background:var(--soft);border-radius:14px;border:3px dashed var(--ink);font-size:16px}
.rules li+li{margin-top:4px}

/* ---------- 말풍선 ---------- */
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 14px;font-family:var(--display);font-size:19px;text-align:center;max-width:320px;margin:0}
.bubble::after{content:"";position:absolute;left:50%;bottom:-12px;width:18px;height:18px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}

/* ---------- HUD ---------- */
.hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:10px 16px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{font-family:var(--display);font-size:24px;font-weight:400;display:block;line-height:1.1}
.who>div{min-width:0}
.who small{color:var(--muted);font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvbadge{font-family:var(--display);font-size:22px;background:var(--rd);border:3px solid var(--ink);border-radius:14px;padding:4px 10px;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
.xp{display:flex;flex-direction:column;gap:4px;min-width:0}
.xplabel{display:flex;justify-content:space-between;font-family:var(--display);font-size:17px;gap:8px}
.xplabel b{font-weight:400;color:var(--cd)}
.pips{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.pip{height:20px;border:3px solid var(--ink);border-radius:8px;background:#fff}
.pip.on{background:linear-gradient(var(--rd),var(--cd))}
.pip.new{animation:pipin .5s ease}
@keyframes pipin{0%{transform:scale(1.6)}100%{transform:scale(1)}}
.hudbtns{display:flex;gap:8px}

/* ---------- 플레이 영역 ---------- */
.play{display:grid;grid-template-columns:minmax(280px,5fr) 7fr;gap:20px;align-items:start}
.stage{background:linear-gradient(var(--soft) 66%,var(--floor) 66%);padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden;position:relative}
.heroBox{width:100%;max-width:330px;aspect-ratio:280/250;position:relative}
.heroBox svg{width:100%;height:100%;display:block;overflow:hidden}
.nametag{font-family:var(--display);font-size:22px;background:var(--ink);color:#fff;border-radius:999px;padding:4px 16px;text-align:center}
.nametag span{color:var(--rd)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stat{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 4px;text-align:center}
.stat b{font-family:var(--display);font-weight:400;font-size:24px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{font-size:13px;color:var(--muted)}
.catbars{display:grid;gap:6px;width:100%}
.catbar{display:grid;grid-template-columns:44px 1fr 64px;align-items:center;gap:8px;font-size:15px}
.catbar .nm{font-family:var(--display);font-size:17px}
.catbar .tr{height:12px;background:#fff;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.catbar .fl{height:100%;width:0;transition:width .4s}
.catbar .num{text-align:right;font-variant-numeric:tabular-nums}

.qcard{padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font-family:var(--display);font-size:17px;background:var(--soft);border:3px solid var(--ink);border-radius:999px;padding:3px 12px}
.combo{font-family:var(--display);font-size:20px;color:var(--cd)}
.combo.hot{animation:wiggle .5s ease}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg) scale(1.15)}75%{transform:rotate(6deg) scale(1.15)}}
.qbody{display:flex;gap:16px;align-items:center}
.qemoji{font-size:clamp(56px,8vw,84px);line-height:1;flex:none;width:1.4em;height:1.4em;display:grid;place-items:center;background:var(--soft);border:3px solid var(--ink);border-radius:24px}
.qtext{font-family:var(--display);font-size:clamp(23px,2.7vw,31px);line-height:1.38;margin:0;min-width:0;word-break:keep-all}
.qask{margin:0;color:var(--muted);font-size:16px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.choice{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px 10px;color:#fff;position:relative}
.choice b{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.4vw,36px);text-shadow:0 3px 0 rgba(36,22,63,.4)}
.choice small{font-family:var(--body);font-size:14px;opacity:.95}
.choice svg{width:56px;height:22px}
.choice.cd{background:var(--cd)} .choice.cv{background:var(--cv)} .choice.rd{background:var(--rd);color:var(--ink)}
.choice.rd b{text-shadow:none}
.choice .ck{position:absolute;top:6px;left:8px;font-family:var(--display);font-size:14px;opacity:.75}
.choice:disabled{cursor:default}
.choice.dim{filter:grayscale(.75) brightness(1.05);opacity:.55}
.choice.right{animation:glow 1s ease infinite alternate}
.choice.wrongpick{animation:shake .4s ease}
.choice .mark{position:absolute;top:-14px;right:-10px;width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:24px;color:#fff}
@keyframes glow{from{box-shadow:0 6px 0 var(--ink),0 0 0 0 rgba(34,184,97,.0)}to{box-shadow:0 6px 0 var(--ink),0 0 0 8px rgba(34,184,97,.55)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.feedback{border:4px solid var(--ink);border-radius:18px;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center}
.feedback.ok{background:#D9F7E5}
.feedback.no{background:#FFE1E4}
.fbhead{font-family:var(--display);font-size:26px}
.feedback.ok .fbhead{color:#12804A}
.feedback.no .fbhead{color:#C8102E}
.feedback p{margin:0;font-size:18px;grid-column:1}
.feedback .go{grid-column:2;grid-row:1/span 2;font-size:24px}

/* ---------- 캐릭터 움직임 ---------- */
.bob{animation:bob 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-6px) scale(.97,1.03)}}
.happy .bob{animation:hop .6s ease 2}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(0) scale(1.12,.86)}60%{transform:translateY(-30px) scale(.92,1.1)}}
.sad .bob{animation:droop .9s ease}
@keyframes droop{0%{transform:scale(1)}30%{transform:scale(1.05,.8) translateX(-6px)}55%{transform:scale(1.05,.8) translateX(6px)}100%{transform:scale(1)}}
.twinkle{animation:tw 1.6s ease-in-out infinite}
.twinkle:nth-child(2){animation-delay:.4s}.twinkle:nth-child(3){animation-delay:.8s}.twinkle:nth-child(4){animation-delay:1.2s}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}

/* ---------- 오버레이 ---------- */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(36,22,63,.6);display:grid;place-items:center;padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.modal{padding:22px;max-width:560px;width:100%;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;animation:pop .4s ease}
.modal h2{font-size:clamp(38px,7vw,56px);color:var(--rd);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);line-height:1.1}
.modal h3{font-size:28px}
.modal p{margin:0;font-size:18px}
.kicker{font-family:var(--display);font-size:18px;background:var(--ink);color:#fff;border-radius:999px;padding:2px 14px}
.evo{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;width:100%}
.evo .heroBox{max-width:220px}
.evo .old{opacity:.55;filter:grayscale(.4)}
.evo .arrow{font-family:var(--display);font-size:34px;color:var(--pink)}
.evo .new{animation:flash 1.1s ease}
@keyframes flash{0%{filter:brightness(4) saturate(0);transform:scale(.4)}50%{filter:brightness(2.2);transform:scale(1.15)}100%{filter:none;transform:scale(1)}}
.modal .btn{margin-top:6px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:21;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.dexmodal{max-width:980px}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:100%;max-height:60vh;overflow-y:auto;padding:4px}
.dexcard{border:3px solid var(--ink);border-radius:16px;background:var(--soft);padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.dexcard .heroBox{max-width:120px}
.dexcard b{font-family:var(--display);font-weight:400;font-size:17px}
.dexcard small{font-size:13px;color:var(--muted)}
.dexcard.lock .heroBox{filter:brightness(0);opacity:.22}
.dexcard.cur{background:#FFE7F1;box-shadow:0 0 0 4px var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn.danger{background:var(--bad);color:#fff}

/* ---------- 좁은 화면 ---------- */
@media (max-width:860px){
  .play{grid-template-columns:1fr}
  .stage{display:grid;grid-template-columns:150px 1fr;align-items:center;justify-items:start;padding:12px;gap:8px 12px}
  .stage .heroBox{grid-row:1/span 2;max-width:150px}
  .stage .say{max-width:none;font-size:17px;justify-self:stretch}
  .stage .say::after{left:-8px;top:50%;bottom:auto;transform:translateY(-50%) rotate(135deg)}
  .stage .nametag{font-size:18px}
  .stage .stats,.stage .catbars{grid-column:1/-1}
  .startgrid{grid-template-columns:1fr}
  .hud{grid-template-columns:1fr auto;gap:10px}
  .xp{grid-column:1/-1;grid-row:2}
}
@media (max-width:560px){
  .choices{grid-template-columns:1fr}
  .choice{flex-direction:row;justify-content:center;gap:12px;padding:10px}
  .choice small{display:none}
  .qbody{flex-direction:column;align-items:flex-start}
  .qemoji{font-size:50px}
  .feedback{grid-template-columns:1fr}
  .feedback .go{grid-column:1;grid-row:auto;width:100%}
  .hudbtns .btn{font-size:14px;padding:5px 8px}
  .catbars,.stage .stats{display:none}
  .stage{grid-template-columns:120px 1fr}
  .stage .heroBox{max-width:120px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<section id="start" class="screen">
  <div class="wrap">
    <div class="logo">
      <span class="kick">전도 · 대류 · 복사</span>
      <h1><em>열돌이</em> 키우기</h1>
    </div>
    <div class="startgrid">
      <div class="box startchar">
        <p class="bubble" id="startSay">안녕! 난 아기 불씨 열돌이야.<br>문제를 맞혀서 나를 키워 줘!</p>
        <div class="heroBox" id="startHero"></div>
      </div>
      <form class="box startform" id="startForm">
        <label for="nameInput">내 이름</label>
        <input id="nameInput" maxlength="10" placeholder="이름을 쓰세요" autocomplete="off">
        <button class="btn go" id="startBtn" type="submit">게임 시작!</button>
        <span class="ptitle" id="pTitleList" hidden>이어서 하기</span>
        <div class="plist" id="profiles"></div>
        <ul class="rules">
          <li>상황을 읽고 <b>전도</b>, <b>대류</b>, <b>복사</b> 중 하나를 골라요.</li>
          <li><b>10문제</b>를 맞힐 때마다 레벨 업! 열돌이가 진화해요.</li>
          <li>틀린 문제는 조금 뒤에 다시 나와요. 150문제를 모두 맞히면 정복!</li>
        </ul>
      </form>
    </div>
  </div>
</section>

<section id="game" class="screen" hidden>
  <div class="wrap">
    <header class="hud box">
      <div class="who">
        <span class="lvbadge" id="lvBadge">Lv.1</span>
        <div><b id="pName"></b><small id="pTitle"></small></div>
      </div>
      <div class="xp">
        <div class="xplabel"><span>다음 진화까지</span><b id="xpLeft">10문제</b></div>
        <div class="pips" id="pips"></div>
      </div>
      <div class="hudbtns">
        <button class="btn small" id="dexBtn" type="button">도감</button>
        <button class="btn small" id="sndBtn" type="button">소리 켬</button>
        <button class="btn small" id="menuBtn" type="button">메뉴</button>
      </div>
    </header>
    <div class="play">
      <div class="stage box">
        <p class="bubble say" id="say">준비됐어? 가 보자!</p>
        <div class="heroBox" id="hero"></div>
        <div class="nametag" id="nameTag"></div>
        <div class="stats">
          <div class="stat"><b id="stSolved">0</b><small>맞힌 문제 / 150</small></div>
          <div class="stat"><b id="stRate">-</b><small>정답률</small></div>
          <div class="stat"><b id="stBest">0</b><small>최고 연속</small></div>
        </div>
        <div class="catbars" id="catbars"></div>
      </div>
      <div class="qcard box">
        <div class="qtop">
          <span class="chip" id="qLeft">남은 문제 150</span>
          <span class="combo" id="combo"></span>
        </div>
        <div class="qbody">
          <div class="qemoji" id="qEmoji" aria-hidden="true"></div>
          <p class="qtext" id="qText"></p>
        </div>
        <p class="qask">이 상황에서 열은 어떤 방법으로 이동했을까요?</p>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="fb" hidden>
          <div class="fbhead" id="fbHead"></div>
          <p id="fbText"></p>
          <button class="btn go" id="nextBtn" type="button">다음 문제 ▶</button>
        </div>
      </div>
    </div>
  </div>
</section>

<div class="overlay" id="ovl" hidden></div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
const RAW = {
  cd: [
    ["🥄", "뜨거운 국에 담가 둔 쇠숟가락의 손잡이까지 뜨거워졌어요.", "국에 닿은 숟가락 끝의 열이 고체인 숟가락을 따라 손잡이까지 이동했어요."],
    ["🍳", "프라이팬을 불에 올려 두면 불이 닿지 않은 가장자리까지 뜨거워져요.", "열이 프라이팬(고체)을 따라 뜨거운 곳에서 차가운 곳으로 이동해요."],
    ["🍳", "프라이팬 손잡이는 나무나 플라스틱으로 만들어요.", "나무와 플라스틱은 열이 잘 전도되지 않아서 손잡이가 덜 뜨거워요."],
    ["🧊", "손바닥 위에 얼음을 올려놓았더니 얼음이 녹았어요.", "맞닿은 손의 열이 얼음으로 직접 이동했어요."],

const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const lvOf = n => Math.min(MAX_LV, 1 + Math.floor(n / PER_LV));
const reduced = (() => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){ return false; } })();

/* ---------- 저장 ---------- */
const KEY = "heatHero.v1";
let DB = {profiles:{}, last:"", sound:true};
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.profiles) DB = {profiles:s.profiles, last:s.last||"", sound:s.sound!==false}; } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e) {} }
function fresh(){ return {solved:[], queue:shuffle(QS.map(q=>q.id)), tries:0, wrong:0, combo:0, best:0, cat:{cd:[0,0],cv:[0,0],rd:[0,0]}}; }
function fix(p){
  const f = fresh();
  p = Object.assign(f, p || {});
  p.solved = (p.solved||[]).filter(id => QMAP[id]);
  const sol = new Set(p.solved);
  p.queue = (p.queue||[]).filter(id => QMAP[id] && !sol.has(id));
  const inq = new Set(p.queue);
  shuffle(QS).forEach(q => { if (!sol.has(q.id) && !inq.has(q.id)) p.queue.push(q.id); });
  ORDER.forEach(c => { if (!Array.isArray(p.cat[c])) p.cat[c] = [0,0]; });
  return p;
}

/* ---------- 소리 ---------- */
let AC = null;
function beep(f, d, type, vol, when){
  if (!DB.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const t0 = AC.currentTime + (when || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(vol || .15, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + d);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + d + .03);
  } catch(e) {}
}
const SND = {
  ok(){ beep(660,.12,"sine",.18); beep(990,.2,"sine",.18,.09); },
  bad(){ beep(240,.18,"square",.07); beep(180,.3,"square",.07,.15); },
  click(){ beep(520,.05,"triangle",.1); },
  combo(){ [784,988,1175].forEach((f,i)=>beep(f,.12,"triangle",.14,i*.07)); },
  up(){ [523,659,784,1047,1319].forEach((f,i)=>beep(f,.22,"triangle",.18,i*.11)); beep(1568,.5,"sine",.15,.6); }
};

const CORE  = "M100 92 C116 116 140 130 140 160 C140 186 122 198 100 198 C78 198 60 186 60 160 C60 138 76 128 84 110 C88 124 94 128 98 128 C96 116 96 104 100 92 Z";
function tier(lv){
  return lv>=15 ? ["#2F5BFF","#5FB2FF","#E2F5FF"]
       : lv>=13 ? ["#FF7A00","#FFD23F","#FFFFFF"]
       : lv>=10 ? ["#F48C06","#FFC93C","#FFF6CC"]
       : lv>=7  ? ["#F3722C","#FFA62B","#FFEFA0"]
       : lv>=4  ? ["#E8432B","#FF8A2A","#FFE08A"]
       :          ["#D62839","#FF6B35","#FFC857"];
}
function star(x,y,r,cls){
  const p = []; for (let i=0;i<8;i++){ const a = Math.PI/4*i - Math.PI/2, rr = i%2 ? r*.42 : r; p.push((x+Math.cos(a)*rr).toFixed(1)+","+(y+Math.sin(a)*rr).toFixed(1)); }
  return `<polygon class="${cls||""}" points="${p.join(" ")}" fill="#FFE45C" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>`;
}

/* ---------- 상태 ---------- */
let NAME = "", P = null, cur = null, locked = false;

function show(id){ document.querySelectorAll(".screen").forEach(s => s.hidden = s.id !== id); window.scrollTo(0,0); }

function renderStart(){
  $("#startHero").innerHTML = heroSVG(1);
  const names = Object.keys(DB.profiles);
  $("#pTitleList").hidden = !names.length;
  $("#profiles").innerHTML = names.map(n => {
    const lv = lvOf((DB.profiles[n].solved||[]).length);
    return `<button type="button" class="btn small pchip" data-name="${esc(n)}">${heroSVG(lv)}<span>${esc(n)} <small>Lv.${lv}</small></span></button>`;
  }).join("");
  if (DB.last && DB.profiles[DB.last]) $("#nameInput").value = DB.last;
  show("start");
}

function enter(name){
  name = String(name||"").trim().slice(0,10);
  if (!name) { $("#nameInput").focus(); $("#startSay").innerHTML = "이름을 먼저 알려 줘!<br>누가 나를 키울 거야?"; $("#startSay").classList.remove("pop"); void $("#startSay").offsetWidth; $("#startSay").classList.add("pop"); return; }
  NAME = name;
  P = DB.profiles[name] = fix(DB.profiles[name]);
  DB.last = name; save();
  $("#pName").textContent = name;
  buildChoices();
  show("game");
  setHero("idle");
  say(P.solved.length ? `${name}, 다시 왔구나! 이어서 해 보자!` : `반가워 ${name}! 같이 쑥쑥 자라 보자!`);
  next();
}

function buildChoices(){
  $("#choices").innerHTML = ORDER.map((c,i) =>
    `<button class="btn choice ${c}" data-c="${c}" type="button"><span class="ck">${i+1}</span>${ICON[c]}<b>${CAT[c]}</b><small>${HINT[c]}</small></button>`).join("");
}

function setHero(mood){ $("#hero").innerHTML = heroSVG(lvOf(P.solved.length), mood); }
function say(t){ const b = $("#say"); b.textContent = t; b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); }

function renderHud(newPip){
  const n = P.solved.length, lv = lvOf(n);
  $("#lvBadge").textContent = "Lv." + lv;
  $("#pTitle").textContent = LV[lv-1].n;
  $("#nameTag").innerHTML = `<span>Lv.${lv}</span> ${esc(LV[lv-1].n)}`;
  const inLv = lv >= MAX_LV ? Math.min(PER_LV, n - (MAX_LV-1)*PER_LV) : n % PER_LV;
  $("#xpLeft").textContent = lv >= MAX_LV ? (n >= TOTAL ? "완전 정복!" : `최종 진화! 정복까지 ${TOTAL-n}문제`) : `${PER_LV - inLv}문제`;
  let pips = ""; for (let i=0;i<PER_LV;i++) pips += `<span class="pip${i<inLv?" on":""}${newPip&&i===inLv-1?" new":""}"></span>`;
  $("#pips").innerHTML = pips;
  $("#stSolved").textContent = n;
  $("#stRate").textContent = P.tries ? Math.round((P.tries - P.wrong) / P.tries * 100) + "%" : "-";
  $("#stBest").textContent = P.best;
  $("#qLeft").textContent = `남은 문제 ${TOTAL - n}`;
  $("#combo").textContent = P.combo >= 2 ? `🔥 ${P.combo}연속 정답!` : "";
  $("#catbars").innerHTML = ORDER.map(c => {
    const [ok, all] = P.cat[c], pct = all ? Math.round(ok/all*100) : 0;
    return `<div class="catbar"><span class="nm">${CAT[c]}</span><span class="tr"><span class="fl" style="display:block;width:${pct}%;background:${CAT_COLOR[c]}"></span></span><span class="num">${all ? pct+"%" : "-"}</span></div>`;
  }).join("");
  $("#sndBtn").textContent = DB.sound ? "소리 켬" : "소리 끔";
}

function next(){
  locked = false;
  renderHud(false);
  $("#fb").hidden = true;
  if (!P.queue.length) { showClear(); return; }
  cur = QMAP[P.queue[0]];
  $("#qEmoji").textContent = cur.e;
  $("#qText").textContent = cur.t;
  document.querySelectorAll(".choice").forEach(b => { b.disabled = false; b.className = "btn choice " + b.dataset.c; const m = b.querySelector(".mark"); if (m) m.remove(); });
  setHero("idle");
  if (Math.random() < .35) say(pick(SAY_IDLE));
}

function answer(c){
  if (locked || !cur) return;
  locked = true;
  const q = cur, ok = c === q.c, before = lvOf(P.solved.length);
  P.tries++; P.cat[q.c][1]++;
  P.queue.shift();
  if (ok) {
    P.solved.push(q.id); P.cat[q.c][0]++; P.combo++; P.best = Math.max(P.best, P.combo);
  } else {
    P.wrong++; P.combo = 0;
    const at = Math.min(P.queue.length, 4 + Math.floor(Math.random()*4));
    P.queue.splice(at, 0, q.id);
  }
  save();

  document.querySelectorAll(".choice").forEach(b => {
    b.disabled = true;
    const isRight = b.dataset.c === q.c, isPick = b.dataset.c === c;
    if (isRight) { b.classList.add("right"); b.insertAdjacentHTML("beforeend", `<span class="mark" style="background:var(--good)">O</span>`); }
    else if (isPick) { b.classList.add("wrongpick"); b.insertAdjacentHTML("beforeend", `<span class="mark" style="background:var(--bad)">X</span>`); }
    else b.classList.add("dim");
  });
  const fb = $("#fb");
  fb.className = "feedback " + (ok ? "ok" : "no");
  $("#fbHead").textContent = ok ? `정답! ${CAT[q.c]}예요` : `아쉬워요! 정답은 ${CAT[q.c]}예요`;
  $("#fbText").textContent = q.x;
  fb.hidden = false;

  renderHud(ok);
  if (ok) {
    SND.ok(); setHero("happy");
    if (P.combo > 0 && P.combo % 5 === 0) { SND.combo(); say(`${P.combo}연속 정답! 불이 활활 붙었다! 🔥`); $("#combo").classList.remove("hot"); void $("#combo").offsetWidth; $("#combo").classList.add("hot"); }
    else say(pick(SAY_OK));
  } else {
    SND.bad(); setHero("sad"); say(pick(SAY_NO));
  }
  const after = lvOf(P.solved.length);
  if (after > before) setTimeout(() => showLevelUp(before, after), 700);
  setTimeout(() => { if (!$("#fb").hidden && $("#ovl").hidden) $("#nextBtn").focus({preventScroll:true}); }, 50);
}

function openOvl(html){ const o = $("#ovl"); o.innerHTML = html; o.hidden = false; const b = o.querySelector(".btn"); if (b) setTimeout(() => b.focus({preventScroll:true}), 60); }
function closeOvl(){ $("#ovl").hidden = true; $("#ovl").innerHTML = ""; if (!$("#fb").hidden) $("#nextBtn").focus({preventScroll:true}); }

function confetti(){
  if (reduced) return;
  const box = $("#confetti"), cols = ["#FF6A3D","#2F9BFF","#FFB800","#FF5FA2","#22B861","#B69CFF"];
  let h = ""; for (let i=0;i<70;i++) h += `<i style="left:${Math.random()*100}%;background:${pick(cols)};animation-duration:${(1.8+Math.random()*1.8).toFixed(2)}s;animation-delay:${(Math.random()*.6).toFixed(2)}s;transform:rotate(${Math.floor(Math.random()*360)}deg)"></i>`;
  box.innerHTML = h; setTimeout(() => { box.innerHTML = ""; }, 4200);
}

  say(b >= MAX_LV ? "최종 진화 완료! 나 이제 우주 최강이야!" : `짜잔! 나 ${LV[b-1].n}(으)로 진화했어!`);
}

  openOvl(`<div class="modal box" role="dialog" aria-label="모두 정복">
    <span class="kicker">150문제 완전 정복!</span>
    <h2>축하해요!</h2>
    <div class="heroBox" style="max-width:260px">${heroSVG(MAX_LV,"happy")}</div>
    <h3>${esc(NAME)} 님은 열의 이동 박사!</h3>
    <p>정답률 ${rate}% · 최고 ${P.best}연속 정답</p>
    <div class="row">
      <button class="btn go" type="button" data-act="home">처음 화면으로</button>
      <button class="btn danger" type="button" data-act="reset">기록 지우고 다시 도전</button>
    </div>
  </div>`);
}

/* ---------- 이벤트 ---------- */
$("#startForm").addEventListener("submit", e => { e.preventDefault(); SND.click(); enter($("#nameInput").value); });
$("#profiles").addEventListener("click", e => { const b = e.target.closest(".pchip"); if (b) { SND.click(); enter(b.dataset.name); } });
$("#choices").addEventListener("click", e => { const b = e.target.closest(".choice"); if (b && !b.disabled) answer(b.dataset.c); });
$("#nextBtn").addEventListener("click", () => { SND.click(); next(); });
$("#dexBtn").addEventListener("click", () => { SND.click(); showDex(); });
$("#menuBtn").addEventListener("click", () => { SND.click(); showMenu(); });
$("#sndBtn").addEventListener("click", () => { DB.sound = !DB.sound; save(); renderHud(false); SND.click(); });
$("#ovl").addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) { if (e.target.id === "ovl" && P && P.queue.length) closeOvl(); return; }
  const act = b.dataset.act;
  SND.click();
  if (act === "close") closeOvl();
  else if (act === "home") { closeOvl(); renderStart(); }
  else if (act === "reset") {
    if (b.dataset.sure) { DB.profiles[NAME] = fresh(); save(); closeOvl(); enter(NAME); }
    else { b.dataset.sure = "1"; b.textContent = "정말? 한 번 더 누르면 지워져요"; }
  }
});
document.addEventListener("keydown", e => {
  if ($("#game").hidden) return;
  if (!$("#ovl").hidden) { if (e.key === "Escape" && P.queue.length) closeOvl(); return; }
  if (e.target.tagName === "INPUT") return;
  const k = {"1":"cd","2":"cv","3":"rd"}[e.key];
  if (k && !locked) { e.preventDefault(); answer(k); }
  else if ((e.key === "Enter" || e.key === " ") && locked && !$("#fb").hidden && document.activeElement !== $("#nextBtn")) { e.preventDefault(); SND.click(); next(); }
});

renderStart();
})();
</script>
